name: verify

# The lane's contract, checked on every push: the metric identities, the
# gravity operator, the step operator, the emission geometry and the
# uniqueness gate must all hold.  Nothing here needs the organiser's rasters --
# every test runs on small synthetic grids with analytically known answers.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the lane test suite
        run: python -m pytest tests -q
      - name: Render the published site from evidence and run the fail-closed gate
        # Moved here when the racing artifact deploy (.github/workflows/pages.yml)
        # was removed: the branch-root Pages build serves the repo verbatim, and
        # this keeps check_site.py running on every push and pull request.
        run: |
          python3 scripts/build_site.py
          python3 scripts/check_site.py

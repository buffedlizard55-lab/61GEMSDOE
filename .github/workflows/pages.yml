name: Pages

# Publishes docs/ to GitHub Pages.  The site is static: every page is rendered
# by scripts/build_site.py from evidence/*.json and docs/data/*.json, so a
# redeploy can never disagree with the evidence it quotes.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'evidence/**'
      - 'scripts/build_site.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render static site from evidence
        run: python3 scripts/build_site.py
      - name: Verify every internal link resolves
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

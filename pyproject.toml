[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems61"
version = "0.1.0"
description = "61GEMSDOE lane: buried-structure basement-depth steps from Parker-Oldenburg inversion of isostatic residual gravity"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "rasterio>=1.3",
    "affine>=2.4",
    "scikit-image>=0.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
